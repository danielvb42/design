<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prisma</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .c1 { fill:var(--data-1); } .c2 { fill:var(--data-2); } .c3 { fill:var(--data-3); } .t { fill:var(--surface-raised); } .w { fill:var(--primary); }
  .blk { rx:var(--radius-lg); } .tile { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-7); max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:120px; line-height:.92; font-weight:700; letter-spacing:-0.03em; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      data-1 (violeta) 168x224 sangrando no topo · data-2 (amarelo) 168x112 · data-3 (ciano) 96x112 sangrando à direita
  arrangement grade modular rente ao topo, calhas de space-5 (16), como a grade de cards de área
  pattern     ladrilhos (linha "geometric, modular"): 16 ladrilhos surface-raised de 32px em passo de 48, dois fundidos em dobro e um em primary — "elevação por degrau de cinza" e o botão branco
  scales      calhas space-5 (16); passo 48 (space-8); cantos radius-lg (12) nos blocos e radius-md (8) nos ladrilhos
-->
<rect class="c1 blk" x="16" y="-24" width="168" height="248" rx="12"/>
<rect class="c2 blk" x="200" y="-24" width="168" height="136" rx="12"/>
<rect class="c3 blk" x="384" y="-24" width="120" height="136" rx="12"/>
<rect class="t tile" x="200" y="128" width="32" height="32" rx="8"/>
<rect class="t tile" x="248" y="128" width="32" height="32" rx="8"/>
<rect class="t tile" x="296" y="128" width="32" height="32" rx="8"/>
<rect class="t tile" x="344" y="128" width="32" height="32" rx="8"/>
<rect class="t tile" x="392" y="128" width="32" height="32" rx="8"/>
<rect class="w tile" x="440" y="128" width="32" height="32" rx="8"/>
<rect class="t tile" x="200" y="176" width="32" height="32" rx="8"/>
<rect class="t tile" x="248" y="176" width="32" height="32" rx="8"/>
<rect class="t tile" x="296" y="176" width="80" height="32" rx="8"/>
<rect class="t tile" x="392" y="176" width="32" height="32" rx="8"/>
<rect class="t tile" x="440" y="176" width="32" height="32" rx="8"/>
<rect class="t tile" x="200" y="224" width="80" height="32" rx="8"/>
<rect class="t tile" x="296" y="224" width="32" height="32" rx="8"/>
<rect class="t tile" x="344" y="224" width="32" height="32" rx="8"/>
<rect class="t tile" x="392" y="224" width="32" height="32" rx="8"/>
<rect class="t tile" x="440" y="224" width="32" height="32" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Prisma</h1>
<p class="tag">Fundo preto, uma cor de identidade por área.</p>
</div>
</div>
</body>
</html>
