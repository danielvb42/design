<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartaz</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .v { fill:var(--data-1); } .o { fill:var(--data-3); } .m { fill:var(--data-2); } .w { fill:var(--primary); } .q { fill:var(--line); }
  .card { rx:var(--radius-xxl); } .pill { rx:6px; }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-7); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:500; letter-spacing:-0.05em; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      data-1 (violeta) 232x208 sangrando no topo · data-3 (laranja) 96x128 e data-2 (magenta) 96x120 sangrando à direita · primary: uma pílula branca de 232x40
  arrangement um card dominante com dois satélites empilhados e a pílula branca embaixo — "um ou dois cards de cor por página", "tudo que é ação é pílula"
  pattern     pílulas (linha "loud, bold, poster type" traduzida em listras-pílula): 12 pílulas de 12px em line, uma em primary, em passo de space-6 (20)
  scales      calhas de 16; passo das pílulas space-6 (20); cards radius-xxl (30); pílulas com raio de meia altura
-->
<rect class="v card" x="136" y="-24" width="232" height="232" rx="30"/>
<rect class="o card" x="384" y="-24" width="120" height="152" rx="30"/>
<rect class="m card" x="384" y="144" width="120" height="120" rx="30"/>
<rect class="w" x="136" y="224" width="232" height="40" rx="20"/>
<rect class="q pill" x="16" y="24" width="104" height="12" rx="6"/>
<rect class="q pill" x="16" y="44" width="72" height="12" rx="6"/>
<rect class="q pill" x="16" y="64" width="88" height="12" rx="6"/>
<rect class="w pill" x="16" y="84" width="56" height="12" rx="6"/>
<rect class="q pill" x="16" y="104" width="104" height="12" rx="6"/>
<rect class="q pill" x="16" y="124" width="64" height="12" rx="6"/>
<rect class="q pill" x="16" y="144" width="96" height="12" rx="6"/>
<rect class="q pill" x="16" y="164" width="80" height="12" rx="6"/>
<rect class="q pill" x="16" y="184" width="48" height="12" rx="6"/>
<rect class="q pill" x="16" y="204" width="104" height="12" rx="6"/>
<rect class="q pill" x="16" y="224" width="72" height="12" rx="6"/>
<rect class="q pill" x="16" y="244" width="88" height="12" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Cartaz</h1>
<p class="tag">Títulos de pôster sobre preto, e um card de cor.</p>
</div>
</div>
</body>
</html>
