<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Chip</title></head>
<body>
<div class="pp-stage">
<div class="pp-chips">
  <button class="pp-chip" aria-pressed="true">Últimos 12 meses</button>
  <button class="pp-chip" aria-pressed="false">1º grau</button>
  <button class="pp-chip" aria-pressed="false"><span class="pp-swatch" style="background:var(--data-1)"></span>Em andamento</button>
  <button class="pp-chip" aria-pressed="false"><span class="pp-swatch" style="background:var(--data-2)"></span>Conclusos</button>
</div>
</div>
</body>
</html>
