<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cobalto</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .p { fill:var(--primary); } .gl { fill:var(--primary-glow); } .g { fill:none; stroke:var(--primary-glow); stroke-width:1; }
  .pane { fill:var(--surface-raised); rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-7); max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:104px; line-height:.92; font-weight:500; letter-spacing:-0.03em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary (disco de 336) com primary-glow (disco de 208) no centro · quatro painéis surface-raised de 112x80 em grade 2x2
  arrangement o holofote atrás, a grade 2x2 de painéis na frente deixando o brilho vazar pelas calhas de space-4 (16)
  pattern     arcos (linha "a literal motif": holofote): três anéis de 1px em primary-glow, raios crescendo em space-6 (24) — "holofote atrás do que importa"
  scales      calhas space-4 (16); passo dos anéis space-6 (24); painéis radius-lg (12)
-->
<circle class="p" cx="312" cy="144" r="168"/>
<circle class="gl" cx="312" cy="144" r="104"/>
<circle class="g" cx="312" cy="144" r="192"/>
<circle class="g" cx="312" cy="144" r="216"/>
<circle class="g" cx="312" cy="144" r="240"/>
<rect class="pane" x="192" y="56" width="112" height="80" rx="12"/>
<rect class="pane" x="320" y="56" width="112" height="80" rx="12"/>
<rect class="pane" x="192" y="152" width="112" height="80" rx="12"/>
<rect class="pane" x="320" y="152" width="112" height="80" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Cobalto</h1>
<p class="tag">Quase preto, com um holofote azul por trás.</p>
</div>
</div>
</body>
</html>
