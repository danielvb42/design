<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>BarChart</title></head>
<body>
<div class="eq-stage" style="align-items:flex-start">
<div class="eq-panel" style="flex:1;min-width:360px"><div class="eq-block"><h3 class="eq-title">Conclusos por unidade</h3>
<div class="eq-bars">
  <div class="eq-bar-row"><span>1ª Vara Cível</span><div class="eq-bar-track"><span class="eq-bar-fill" style="width:92%"></span></div><b>124</b></div>
  <div class="eq-bar-row"><span>2ª Vara Cível</span><div class="eq-bar-track"><span class="eq-bar-fill" style="width:73%"></span></div><b>98</b></div>
  <div class="eq-bar-row"><span>Vara de Família</span><div class="eq-bar-track"><span class="eq-bar-fill" style="width:54%"></span></div><b>73</b></div>
  <div class="eq-bar-row"><span>Juizado Especial</span><div class="eq-bar-track"><span class="eq-bar-fill" style="width:38%"></span></div><b>51</b></div>
  <div class="eq-bar-row"><span>Vara Criminal</span><div class="eq-bar-track"><span class="eq-bar-fill" style="width:27%"></span></div><b>36</b></div>
</div>
</div></div>
<div class="eq-panel" style="flex:1;min-width:320px"><div class="eq-block"><h3 class="eq-title">Situação do acervo</h3>
<div class="eq-stackbar" aria-hidden="true"><span style="flex:62;background:var(--data-1)"></span><span style="flex:25;background:var(--data-2)"></span><span style="flex:9;background:var(--data-3)"></span><span style="flex:4;background:var(--data-4)"></span></div>
<table class="eq-table">
  <tr><td><span class="eq-swatch" style="background:var(--data-1)"></span> Em andamento</td><td class="num">774</td><td class="num muted">62%</td></tr>
  <tr><td><span class="eq-swatch" style="background:var(--data-2)"></span> Conclusos</td><td class="num">312</td><td class="num muted">25%</td></tr>
  <tr><td><span class="eq-swatch" style="background:var(--data-3)"></span> Suspensos</td><td class="num">112</td><td class="num muted">9%</td></tr>
  <tr><td><span class="eq-swatch" style="background:var(--data-4)"></span> Arquivados</td><td class="num">50</td><td class="num muted">4%</td></tr>
</table>
</div></div>
</div>
</body>
</html>
